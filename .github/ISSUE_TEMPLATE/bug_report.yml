name: Bug report
description: Report a reproducible issue without sharing financial data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Bankin passwords, request headers, exported JSON/CSV files, import keys, balances, or screenshots with real financial data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fake or redacted data only.
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.0.0"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Chromium
        - Brave
        - Other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this issue does not include sensitive financial data, Bankin headers, or import keys.
          required: true
